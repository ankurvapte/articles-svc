# Dev-only default password; set ARTICLES_DB_PASSWORD in your shell or .env for anything else.
x-articles-db-url: &articles-db-url postgresql://articles:${ARTICLES_DB_PASSWORD:-articles-dev-password}@articles-db:5432/articles

services:
  articles-svc:
    build: .
    image: articles-svc:local
    ports:
      - "8090:8080"
    environment:
      LOG_LEVEL: INFO
      DEFAULT_PAGE_SIZE: "5"
      MAX_PAGE_SIZE: "50"
      DATABASE_URL: *articles-db-url
      SEED_FILE: /app/data/news.json
    depends_on:
      articles-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot: applies pending migrations, then exits. articles-svc starts only if
  # it succeeds, so exactly one process changes the schema, however many replicas run.
  articles-migrate:
    build: .
    image: articles-svc:local
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: *articles-db-url
    depends_on:
      articles-db:
        condition: service_healthy
    healthcheck:
      disable: true  # the image's HTTP healthcheck is for the API, not this job

  # Database per service: only articles-svc talks to this. No host port is
  # published; use `docker compose exec articles-db psql -U articles` to look inside.
  articles-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: articles
      POSTGRES_PASSWORD: ${ARTICLES_DB_PASSWORD:-articles-dev-password}
      POSTGRES_DB: articles
    volumes:
      - articles-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U articles -d articles"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  articles-db-data:
